<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d1014" />
    <title>Gestão de Validades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- O conteúdo abaixo é substituído pelo app assim que ele monta. Se ele
         continuar na tela, o JavaScript não rodou — e uma tela em branco sem
         explicação é o pior jeito de descobrir isso. -->
    <div id="root">
      <div class="boot">
        <strong>Gestão de Validades</strong>
        <p>Carregando…</p>
        <p class="boot-hint">
          Se esta mensagem não sair, o aplicativo não conseguiu iniciar neste navegador.
          Recarregue a página; se continuar, o navegador pode estar bloqueando scripts.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
